<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — 这杯茶凉了 · Cha Playground</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#14120f" />
<meta name="color-scheme" content="dark" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<style>
  :root { color-scheme: dark; --bg: #14120f; --text: #e8e2d5; --dim: #a89a86; --accent: #d9a441; --line: #2e2a22; --mono: ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans SC', monospace; }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { text-align: center; max-width: 460px; }
  .cup { font-size: 44px; margin: 0; }
  .code { font-size: 64px; font-weight: 700; color: var(--accent); margin: 4px 0 0; letter-spacing: 6px; }
  h1 { font-size: 17px; margin: 10px 0 8px; font-weight: 600; }
  p.desc { color: var(--dim); font-size: 13px; line-height: 1.8; margin: 0 0 24px; }
  a.btn { display: inline-block; font-size: 13px; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px 16px; text-decoration: none; margin: 0 4px; }
  a.btn.primary { background: var(--accent); color: #14120f; border-color: var(--accent); font-weight: 600; }
  a.btn:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<main class="card">
  <p class="cup">☕</p>
  <p class="code">404</p>
  <h1>这杯茶凉了</h1>
  <p class="desc">你访问的页面不存在——也许是被喝掉了，<br />也许是茶叶放错了壶里。</p>
  <a class="btn primary" href="/">回 Playground 泡一杯新的</a>
  <a class="btn" href="https://github.com/huqinyuan923-hue/cha-lang" rel="noopener">看看源码</a>
</main>
</body>
</html>
