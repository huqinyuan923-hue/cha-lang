<style>
  :root {
    color-scheme: dark;
    --bg: #14120f; --panel: #1d1a15; --line: #2e2a22; --text: #e8e2d5;
    --dim: #a89a86; --accent: #d9a441; --ok: #7fb069; --err: #e07a5f; --mono: ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans SC', monospace;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea:focus-visible, #output:focus-visible { outline-offset: -2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); font-weight: 600; }
  header span { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  select, button { font-family: var(--mono); font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #14120f; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  section:last-child { border-right: none; }
  .pane-title { margin: 0; font-size: 12px; font-weight: 400; color: var(--dim); padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  textarea { flex: 1; background: transparent; color: var(--text); border: none; outline: none; resize: none; padding: 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 4; }
  pre { flex: 1; margin: 0; padding: 14px; overflow: auto; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  pre.disasm { white-space: pre; }
  .out-err { color: var(--err); }
  .out-line { color: var(--text); }
  .meta { color: var(--dim); }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    header { gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 15px; }
    header .tagline { display: none; }
    .controls { margin-left: 0; width: 100%; gap: 6px; }
    .controls select { flex: 1 1 0; min-width: 0; }
    .controls button { flex: 0 0 auto; }
    select, button, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>茶 ☕ Playground</h1>
  <span class="tagline">TypeScript 手写的字节码编译器 + 栈式虚拟机，全程在你的浏览器里运行</span>
  <div class="controls">
    <label class="sr-only" for="example">示例程序</label>
    <select id="example"></select>
    <label class="sr-only" for="backend">执行后端</label>
    <select id="backend">
      <option value="vm">后端：字节码 VM</option>
      <option value="tree">后端：树遍历解释器</option>
    </select>
    <button id="share" type="button" title="复制包含当前代码与后端的分享链接">分享</button>
    <button id="run" class="primary" type="button" title="运行（Ctrl/Cmd + Enter）" aria-keyshortcuts="Control+Enter Meta+Enter">▶ 运行</button>
  </div>
</header>
<main>
  <section aria-labelledby="source-title">
    <h2 class="pane-title" id="source-title"><span>源码</span><span id="timing" class="meta"></span></h2>
    <label class="sr-only" for="editor">Cha 源码编辑器</label>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" title="Tab 缩进 · Shift+Tab 反缩进 · Ctrl/Cmd+/ 注释 · Ctrl/Cmd+Enter 运行"></textarea>
  </section>
  <section aria-labelledby="output-title">
    <h2 class="pane-title" id="output-title">
      <span>输出</span>
      <span><label><input type="checkbox" id="showDisasm" /> 字节码视图</label></span>
    </h2>
    <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    <pre id="output" aria-label="运行输出" tabindex="0"></pre>
  </section>
</main>
<script src="./bundle.js"></script>
</body>
