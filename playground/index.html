<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cha（茶）Playground — 字节码 VM 在线运行</title>
<style>
  :root {
    --bg: #14120f; --panel: #1d1a15; --line: #2e2a22; --text: #e8e2d5;
    --dim: #8a8272; --accent: #d9a441; --ok: #7fb069; --err: #e07a5f; --mono: ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans SC', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); font-weight: 600; }
  header span { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  select, button { font-family: var(--mono); font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: #14120f; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  section { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  section:last-child { border-right: none; }
  .pane-title { font-size: 12px; color: var(--dim); padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  textarea { flex: 1; background: transparent; color: var(--text); border: none; outline: none; resize: none; padding: 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 4; }
  pre { flex: 1; margin: 0; padding: 14px; overflow: auto; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  pre.disasm { white-space: pre; }
  .out-err { color: var(--err); }
  .out-line { color: var(--text); }
  .meta { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>茶 ☕ Playground</h1>
  <span>TypeScript 手写的字节码编译器 + 栈式虚拟机，全程在你的浏览器里运行</span>
  <div class="controls">
    <select id="example"></select>
    <select id="backend">
      <option value="vm">后端：字节码 VM</option>
      <option value="tree">后端：树遍历解释器</option>
    </select>
    <button id="run" class="primary">▶ 运行</button>
  </div>
</header>
<main>
  <section>
    <div class="pane-title"><span>源码</span><span id="timing" class="meta"></span></div>
    <textarea id="editor" spellcheck="false"></textarea>
  </section>
  <section>
    <div class="pane-title">
      <span>输出</span>
      <span><label><input type="checkbox" id="showDisasm" /> 字节码视图</label></span>
    </div>
    <pre id="output"></pre>
  </section>
</main>
<script src="./bundle.js"></script>
</body>
</html>
