<style>
  :root {
    color-scheme: dark;
    --bg: #14120f; --panel: #1d1a15; --line: #2e2a22; --text: #e8e2d5;
    --dim: #a89a86; --accent: #d9a441; --ok: #7fb069; --err: #e07a5f; --flow: #7fa8d9; --mono: ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans SC', monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea:focus-visible, #output:focus-visible { outline-offset: -2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--mono); display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; color: var(--accent); font-weight: 600; }
  header span { color: var(--dim); font-size: 12px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  select, button { font-family: var(--mono); font-size: 13px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .link-btn { font-family: var(--mono); font-size: 13px; color: var(--dim); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  .link-btn:hover { color: var(--text); border-color: var(--dim); }
  button.primary { background: var(--accent); color: #14120f; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled, #traceRange:disabled { opacity: .45; cursor: default; }
  button:disabled:hover { border-color: var(--line); filter: none; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  section { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-right: 1px solid var(--line); }
  section:last-child { border-right: none; }
  .pane-title { font-size: 12px; color: var(--dim); padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .pane-title h2 { margin: 0; font-size: 12px; font-weight: 400; color: inherit; }
  .pane-tools { display: inline-flex; align-items: center; gap: 10px; }
  .pane-title button { font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .pane-title button:hover { border-color: var(--dim); }
  textarea { flex: 1; background: transparent; color: var(--text); border: none; outline: none; resize: none; padding: 14px; font-family: var(--mono); font-size: 14px; line-height: 1.6; tab-size: 4; }
  pre { flex: 1; margin: 0; padding: 14px; overflow: auto; font-size: 13px; line-height: 1.55; white-space: pre-wrap; }
  pre.disasm { white-space: pre; }
  .d-fn { color: var(--accent); font-weight: 600; }
  .d-addr { color: var(--dim); }
  .d-op { color: var(--accent); }
  .d-str { color: var(--ok); }
  .d-jump { color: var(--flow); }
  .d-pos { color: var(--dim); }
  .out-err { color: var(--err); }
  .err-block { margin-top: 8px; min-width: 0; max-width: 100%; }
  .err-snippet { color: var(--dim); white-space: pre; overflow-x: auto; line-height: 1.5; max-width: 100%; box-sizing: border-box; }
  .err-caret { color: var(--err); font-weight: 700; }
  .out-line { color: var(--text); }
  .meta { color: var(--dim); }
  .trace-panel { flex: 0 0 auto; max-height: 45%; overflow: auto; border-top: 1px solid var(--line); padding: 8px 14px 12px; font-size: 12px; }
  .trace-panel:focus-visible { outline-offset: -2px; }
  .trace-bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .trace-bar button { font-size: 12px; padding: 2px 8px; border-radius: 6px; }
  #traceRange { flex: 1 1 110px; min-width: 80px; accent-color: var(--accent); }
  .trace-body { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .trace-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .trace-label { color: var(--dim); }
  .trace-frames { color: var(--flow); overflow-wrap: anywhere; }
  .trace-window { border: 1px solid var(--line); border-radius: 6px; overflow: auto; }
  .trace-line { padding: 2px 8px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--dim); }
  .trace-line.current { color: var(--text); background: #26221a; border-left: 3px solid var(--accent); padding-left: 5px; font-weight: 600; }
  .trace-stack { display: flex; flex-direction: column; gap: 2px; max-height: 84px; overflow: auto; }
  .trace-slot { overflow-wrap: anywhere; }
  .trace-slot-index { color: var(--dim); display: inline-block; min-width: 38px; }
  .trace-note { color: var(--accent); }
  .trace-empty { margin-top: 6px; }
  .noscript { margin: 0; padding: 10px 16px; background: #2e2a22; color: var(--text); border-bottom: 1px solid var(--line); font-size: 13px; text-align: center; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    header { gap: 8px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
    header h1 { font-size: 15px; }
    header .tagline { display: none; }
    .controls { margin-left: 0; width: 100%; gap: 6px; }
    .controls select { flex: 1 1 calc(50% - 3px); min-width: 0; }
    .controls button, .controls .link-btn { flex: 0 0 auto; padding: 6px 10px; }
    select, button, textarea, .link-btn { font-size: 16px; }
    .trace-panel { max-height: 55%; }
  }
</style>
</head>
<body>
<noscript><p class="noscript">这个 Playground 需要 JavaScript 才能运行 Cha 编译器——请在浏览器设置中开启后刷新页面。</p></noscript>
<header>
  <h1>茶 ☕ Playground</h1>
  <span class="tagline">TypeScript 手写的字节码编译器 + 栈式虚拟机，全程在你的浏览器里运行</span>
  <div class="controls">
    <label class="sr-only" for="example">示例程序</label>
    <select id="example"></select>
    <label class="sr-only" for="backend">执行后端</label>
    <select id="backend">
      <option value="vm">后端：字节码 VM</option>
      <option value="tree">后端：树遍历解释器</option>
    </select>
    <button id="compare" type="button" title="依次运行两个后端并对比耗时">对比</button>
    <button id="share" type="button" title="复制包含当前代码与后端的分享链接">分享</button>
    <button id="run" class="primary" type="button" title="运行（Ctrl/Cmd + Enter）" aria-keyshortcuts="Control+Enter Meta+Enter">▶ 运行</button>
    <a class="link-btn" href="https://github.com/huqinyuan923-hue/cha-lang" target="_blank" rel="noopener" title="在 GitHub 上查看 Cha 的源码">GitHub</a>
  </div>
</header>
<main>
  <section aria-labelledby="source-title">
    <div class="pane-title">
      <h2 id="source-title">源码</h2>
      <span id="timing" class="meta"></span>
    </div>
    <label class="sr-only" for="editor">Cha 源码编辑器</label>
    <textarea id="editor" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" title="Tab 缩进 · Shift+Tab 反缩进 · Ctrl/Cmd+/ 注释 · Ctrl/Cmd+Enter 运行"></textarea>
  </section>
  <section aria-labelledby="output-title">
    <div class="pane-title">
      <h2 id="output-title">输出</h2>
      <span class="pane-tools">
        <button id="copy" type="button" title="复制输出文本">复制</button>
        <label><input type="checkbox" id="showDisasm" /> 字节码视图</label>
        <label title="仅字节码 VM 后端；点「运行」采集轨迹"><input type="checkbox" id="showTrace" /> 执行轨迹</label>
      </span>
    </div>
    <span id="status" class="sr-only" role="status" aria-live="polite"></span>
    <pre id="output" aria-label="运行输出" tabindex="0"></pre>
    <div id="tracePanel" class="trace-panel" role="region" aria-label="执行轨迹" tabindex="0" hidden>
      <div class="trace-bar">
        <button id="traceFirst" type="button" aria-label="回到开头" title="回到开头（Home）">⏮</button>
        <button id="tracePrev" type="button" aria-label="上一步" title="上一步（←）">◀</button>
        <button id="tracePlay" type="button" aria-label="播放轨迹" title="播放/暂停（空格）">▶ 播放</button>
        <button id="traceNext" type="button" aria-label="下一步" title="下一步（→）">▶</button>
        <button id="traceLast" type="button" aria-label="跳到末尾" title="跳到末尾（End）">⏭</button>
        <input id="traceRange" type="range" min="0" max="0" value="0" step="1" aria-label="轨迹进度" />
        <span id="traceCount" class="meta">第 0 / 0 步</span>
        <button id="traceCopy" type="button" title="复制当前步的指令、调用栈与栈快照">复制本步</button>
      </div>
      <div id="traceEmpty" class="trace-empty meta">按「运行」采集轨迹</div>
      <div id="traceBody" class="trace-body" hidden>
        <div class="trace-head"><span class="trace-label">调用栈</span><span id="traceFrames" class="trace-frames"></span></div>
        <div class="trace-label">当前指令</div>
        <div id="traceWindow" class="trace-window"></div>
        <div class="trace-head"><span class="trace-label">栈快照</span><span id="traceStackInfo" class="meta"></span></div>
        <div id="traceStack" class="trace-stack"></div>
        <div id="traceNote" class="trace-note" hidden></div>
      </div>
    </div>
  </section>
</main>
<script src="./bundle.js"></script>
</body>
